name: Student navigation regression
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/localization/**"
      - "scripts/verify-student-*.mjs"
      - "scripts/test-student-*.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/student-navigation.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/localization/**"
      - "scripts/verify-student-*.mjs"
      - "scripts/test-student-*.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  student-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify student Phases 1–7, including inbox filters and notification read-state
        run: pnpm verify:student:phase7

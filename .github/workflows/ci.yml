name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Operational scripts syntax
        run: pnpm ops:check

      - name: Step 20 release evidence and static gates
        run: pnpm verify:release

      - name: Admin Accounts Phase 6 locale, a11y and network safeguards
        run: pnpm verify:accounts

      - name: Admin Communication and Fees Phase 1 accounting, independent loading and responsive navigation
        run: pnpm verify:admin-communication:phase1

      - name: Admin Communication and Fees Phase 2 announcements, recipient previews and school timezone
        run: pnpm verify:admin-communication:phase2

      - name: Admin Communication and Fees Phase 3 invoice numbering, pagination, draft safety and RTL
        run: pnpm verify:admin-communication:phase3

      - name: Admin Communication and Fees Phase 4 ledgers, receipts and student balances
        run: pnpm verify:admin-communication:phase4

      - name: Admin Communication and Fees Phase 5 scheduler health, delivery safety and reminders
        run: pnpm verify:admin-communication:phase5

      - name: Admin Communication and Fees Phase 6 reports, CSV, reconciliation and bulk preview
        run: pnpm verify:admin-communication:phase6

      - name: Admin Communication and Fees Phase 7 scheduler race and push claim safety
        run: pnpm verify:admin-communication:phase7

      - name: Admin Fees responsive RTL reminder and invoice layout
        run: pnpm verify:admin-fees:layout

      - name: Admin 70% titles and 80% subtitles layout
        run: pnpm verify:admin-headings

      - name: Admin localized section-specific loading states
        run: pnpm verify:admin-loading

      - name: Pilot Operations Phase 1 regression guard
        run: pnpm verify:pilot

      - name: Pilot Operations Phase 2 coverage regression guards
        run: pnpm verify:pilot:phase2

      - name: Pilot Operations Phase 3 import safety regression guard
        run: pnpm verify:pilot:phase3

      - name: Pilot Operations Phase 4 safe audit and export guard
        run: pnpm verify:pilot:phase4

      - name: Pilot Operations Phase 5 subscription health and reminder guard
        run: pnpm verify:pilot:phase5

      - name: Pilot Operations Phase 6 launch and support workflow guard
        run: pnpm verify:pilot:phase6

      - name: Phase 7 release and cross-role acceptance guard
        run: pnpm verify:pilot:phase7

      - name: Parent three-language and resilience regressions
        run: |
          pnpm verify:parent-localization
          pnpm verify:parent-resilience

      - name: Parent Experience Phase 1 navigation and security guard
        run: pnpm verify:parent:phase1

      - name: Parent Experience Phase 2 daily Home and alert regression
        run: pnpm verify:parent:phase2

      - name: Parent Experience Phase 3 attendance calendar and access regression
        run: pnpm verify:parent:phase3

      - name: Parent Experience Phase 4 academics filtering and privacy regression
        run: pnpm verify:parent:phase4

      - name: Parent Experience Phase 5 Inbox filtering and exact-link regression
        run: pnpm verify:parent:phase5

      - name: Parent Experience Phase 6 parent More, fees and secure preferences regression
        run: pnpm verify:parent:phase6

      - name: Parent Experience Phase 7 cross-account, session epoch and Android evidence gates
        run: pnpm verify:parent:phase7

      - name: Development API and public ngrok readiness regression
        run: pnpm verify:dev-api

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Record production NO-GO until independent release evidence is reviewed
        if: always()
        run: node scripts/phase7-release-report.mjs --output "$RUNNER_TEMP/maktablink-step20-no-go.json"

      - name: Preserve exact-build Step 20 acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step20-release-evidence-no-go
          path: ${{ runner.temp }}/maktablink-step20-no-go.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record Admin Communication/Fees Phase 7 independent manual acceptance as NO-GO
        if: always()
        run: node scripts/phase7-communication-report.mjs --output "$RUNNER_TEMP/maktablink-communication-fees-phase7-no-go.json"

      - name: Preserve exact-build Communication and Fees Phase 7 manual matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: communication-fees-phase7-manual-no-go
          path: ${{ runner.temp }}/maktablink-communication-fees-phase7-no-go.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record Parent Phase 7 device acceptance as NO-GO
        if: always()
        run: node scripts/parent-phase7-acceptance.mjs --output "$RUNNER_TEMP/maktablink-parent-phase7-no-go.json"

      - name: Preserve parent Android acceptance NO-GO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-phase7-android-no-go
          path: ${{ runner.temp }}/maktablink-parent-phase7-no-go.json
          if-no-files-found: warn
          retention-days: 30

  windows-api-regression:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Release evidence and parent locale/resilience (Windows)
        run: |
          pnpm verify:accounts
          pnpm verify:admin-communication:phase1
          pnpm verify:admin-communication:phase2
          pnpm verify:admin-communication:phase3
          pnpm verify:admin-communication:phase4
          pnpm verify:admin-communication:phase5
          pnpm verify:admin-communication:phase6
          pnpm verify:admin-communication:phase7
          pnpm verify:admin-fees:layout
          pnpm verify:admin-headings
          pnpm verify:admin-loading
          pnpm verify:pilot
          pnpm verify:pilot:phase2
          pnpm verify:pilot:phase3
          pnpm verify:pilot:phase4
          pnpm verify:pilot:phase5
          pnpm verify:pilot:phase6
          pnpm verify:pilot:phase7
          pnpm verify:release
          pnpm verify:parent-localization
          pnpm verify:parent-resilience
          pnpm verify:parent:phase1
          pnpm verify:parent:phase2
          pnpm verify:parent:phase3
          pnpm verify:parent:phase4
          pnpm verify:parent:phase5
          pnpm verify:parent:phase6
          pnpm verify:parent:phase7
      - name: Test API (Windows / Node 22)
        run: pnpm --filter @maktablink/api test

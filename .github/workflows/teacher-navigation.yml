name: Teacher navigation regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/teacher-navigation.yml"
      - "apps/mobile/**"
      - "packages/localization/**"
      - "scripts/verify-teacher-experience-phase*.mjs"
      - "scripts/test-teacher-*.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/localization/**"
      - "scripts/verify-teacher-experience-phase*.mjs"
      - "scripts/test-teacher-*.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teacher-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teacher-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify teacher Phases 1–7, teaching attendance and communication
        run: pnpm verify:teacher:phase7
